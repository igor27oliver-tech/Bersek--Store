             // spring.datasource.url=jdbc:h2:mem:discocrafia;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:h2:file:./database/discocrafia1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:Db

# Spring Security default dev user (username/password)
spring.security.user.name=admin
spring.security.user.password=123
server.address=0.0.0.0
server.port=8080